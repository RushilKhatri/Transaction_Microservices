apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - postgres.yaml
  - vault.yaml
  - transaction.yaml
  - fraud.yaml
  - notification.yaml
  - frontend.yaml
  - ingress.yaml

configMapGenerator:
  - name: postgres-init-sql
    files:
      - init.sql=../infra/postgres/init.sql

generatorOptions:
  disableNameSuffixHash: true