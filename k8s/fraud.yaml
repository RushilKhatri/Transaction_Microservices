apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-service
  labels:
    app: fraud-detection-service
spec:
  selector:
    app: fraud-detection-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection-service
  template:
    metadata:
      labels:
        app: fraud-detection-service
    spec:
      initContainers:
        - name: wait-for-transaction
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://transaction-service:5001/health >/dev/null 2>&1; do echo waiting for transaction; sleep 2; done
        - name: wait-for-vault
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://vault:8200/v1/sys/health >/dev/null 2>&1; do echo waiting for vault; sleep 2; done
      containers:
        - name: fraud-detection-service
          image: rushilkhatri/banking-fraud-detection-service:v1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          envFrom:
            - configMapRef:
                name: banking-config
            - secretRef:
                name: banking-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 10
